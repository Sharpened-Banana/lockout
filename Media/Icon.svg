<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb3ff"/>
      <stop offset="0.55" stop-color="#3399ff"/>
      <stop offset="1" stop-color="#1f6fd1"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f97a6"/>
      <stop offset="0.45" stop-color="#e6ebf2"/>
      <stop offset="1" stop-color="#7d8594"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%">
      <stop offset="0" stop-color="#3399ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3399ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- backdrop -->
  <rect x="0" y="0" width="256" height="256" fill="url(#bg)"/>
  <circle cx="128" cy="150" r="112" fill="url(#glow)"/>
  <!-- shackle -->
  <path d="M78 122 V92 a50 50 0 0 1 100 0 V122" fill="none" stroke="#06070a" stroke-width="34" stroke-linecap="round"/>
  <path d="M78 122 V92 a50 50 0 0 1 100 0 V122" fill="none" stroke="url(#shackle)" stroke-width="24" stroke-linecap="round"/>
  <!-- body -->
  <rect x="44" y="112" width="168" height="120" rx="22" fill="#06070a"/>
  <rect x="50" y="118" width="156" height="108" rx="17" fill="url(#body)"/>
  <rect x="50" y="118" width="156" height="20" rx="10" fill="#ffffff" opacity="0.18"/>
  <!-- keyhole -->
  <circle cx="128" cy="162" r="19" fill="#0a0e18"/>
  <path d="M118 166 L111 204 H145 L138 166 Z" fill="#0a0e18"/>
  <!-- frame -->
  <rect x="3" y="3" width="250" height="250" rx="10" fill="none" stroke="#3a4356" stroke-width="6"/>
</svg>
